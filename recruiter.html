<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Dashboard - InternHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 26px;
        }

        header button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .stat-card h3 {
            color: #555;
            margin-bottom: 12px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .application {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .application h3 {
            margin-bottom: 8px;
            color: #2563eb;
        }

        .application p {
            margin: 6px 0;
            color: #555;
        }

        .status-buttons {
            margin-top: 15px;
        }

        .status-buttons button {
            border: none;
            padding: 9px 14px;
            margin-right: 8px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .review-btn {
            background: #f59e0b;
        }

        .selected-btn {
            background: #16a34a;
        }

        .rejected-btn {
            background: #dc2626;
        }

        .status {
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
            }

            .container {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>InternHub - Recruiter</h1>

    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="welcome">
        <h2>Recruiter Dashboard</h2>
        <p>Manage internship applications and update applicant status.</p>
    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Applications</h3>
            <div class="number" id="totalApplications">0</div>
        </div>

        <div class="stat-card">
            <h3>Under Review</h3>
            <div class="number" id="underReview">0</div>
        </div>

        <div class="stat-card">
            <h3>Selected</h3>
            <div class="number" id="selected">0</div>
        </div>

    </div>

    <div class="card">

        <h2>All Applications</h2>

        <div id="applicationList"></div>

    </div>

</div>

<script>

function loadApplications() {

    const applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    const applicationList =
        document.getElementById("applicationList");

    const totalApplications =
        document.getElementById("totalApplications");

    const underReview =
        document.getElementById("underReview");

    const selected =
        document.getElementById("selected");

    totalApplications.textContent =
        applications.length;

    underReview.textContent =
        applications.filter(function(application) {
            return application.status === "Under Review";
        }).length;

    selected.textContent =
        applications.filter(function(application) {
            return application.status === "Selected";
        }).length;

    applicationList.innerHTML = "";

    if (applications.length === 0) {

        applicationList.innerHTML =
            "<p>No applications found.</p>";

        return;
    }

    applications.forEach(function(application, index) {

        const div = document.createElement("div");

        div.className = "application";

        div.innerHTML = `
            <h3>${application.internship}</h3>

            <p>
                <strong>Student Email:</strong>
                ${application.email}
            </p>

            <p>
                <strong>Applied Date:</strong>
                ${application.date}
            </p>

            <p>
                <strong>Status:</strong>
                <span class="status">
                    ${application.status}
                </span>
            </p>

            <div class="status-buttons">

                <button
                    class="review-btn"
                    onclick="updateStatus(${index}, 'Under Review')">
                    Under Review
                </button>

                <button
                    class="selected-btn"
                    onclick="updateStatus(${index}, 'Selected')">
                    Selected
                </button>

                <button
                    class="rejected-btn"
                    onclick="updateStatus(${index}, 'Rejected')">
                    Rejected
                </button>

            </div>
        `;

        applicationList.appendChild(div);

    });
}


function updateStatus(index, newStatus) {

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    if (!applications[index]) {
        return;
    }

    applications[index].status = newStatus;

    localStorage.setItem(
        "applications",
        JSON.stringify(applications)
    );

    alert(
        "Application status updated to " + newStatus
    );

    loadApplications();
}


function logout() {

    window.location.href = "index.html";

}


window.onload = function() {

    loadApplications();

};

</script>

</body>
</html>
